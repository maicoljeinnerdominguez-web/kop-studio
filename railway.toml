[build]
builder = "nixpacks"
buildCommand = "npx prisma generate && npm run build && mkdir -p .next/standalone/prisma && cp prisma/schema.prisma .next/standalone/prisma/"

[deploy]
startCommand = "sh -c 'echo DATABASE_URL=${POSTGRES_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/${POSTGRES_DATABASE}} > .next/standalone/.env && cd .next/standalone && exec node server.js'"